<!DOCTYPE html>
<html lang="fr">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>COFINANCE CI — Mon espace</title>
  <link rel="stylesheet" href="/static/css/premium-theme.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
  <style>
    :root {
      --bleu: var(--accent-purple);
      --bleu2: var(--accent-purple-hover);
      --bleu-clair: var(--accent-purple-dim);
      --or: var(--accent-gold);
      --bg: var(--bg-app);
      --blanc: var(--bg-card);
      --gris: var(--text-secondary);
      --gris2: var(--bg-hover);
      --rouge: var(--accent-red);
      --vert: var(--accent-green);
      --vert2: var(--accent-green-dim);
      --radius: var(--radius-md);
      --shadow: var(--shadow-sm);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: var(--font-body);
      background: var(--bg-app);
      color: var(--text-primary);
    }

    .layout {
      display: flex;
      min-height: 100vh;
    }

    .sidebar-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: var(--bg-overlay);
      z-index: 99;
    }
  </style>
</head>

<body>
  <div class="layout">

    <!-- SIDEBAR -->
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-logo">
        <div class="name">COFINANCE <span>CI</span></div>
        <div class="tagline">Microfinance & Assurance Mobile</div>
      </div>
      <div class="sidebar-user">
        <div class="avatar" id="nav-avatar">?</div>
        <div class="user-info">
          <div class="user-name" id="nav-username">Chargement…</div>
          <div class="user-role" id="nav-role">—</div>
        </div>
      </div>
      <nav class="nav" id="nav-links">
        <!-- rempli par JS selon le rôle -->
      </nav>
      <div class="sidebar-footer">
        <button class="btn-logout" onclick="seDeconnecter()"> Se déconnecter</button>
      </div>
    </aside>

    <!-- MAIN -->
    <div class="main">
      <div class="topbar">
        <div class="topbar-title" id="page-title">Tableau de bord</div>
        <div class="topbar-right">
          <div class="notif-badge" onclick="afficherPage('notifications')" title="Notifications">
            <span class="badge" id="notif-count" style="display:none">0</span>
          </div>
          <div style="font-size:13px;color:var(--gris)" id="topbar-name"></div>
        </div>
      </div>

      <div class="content" id="page-content">
        <!-- contenu injecté par JS -->
      </div>
    </div>
  </div>

  <!-- TOAST -->
  <div id="toast"></div>

  <!-- MODALS -->
  <div class="modal-overlay" id="modal-credit">
    <div class="modal">
      <div class="modal-title">
        Nouvelle demande de crédit
        <span class="modal-close" onclick="fermerModal('modal-credit')">×</span>
      </div>
      <div class="form-grid">
        <div class="field">
          <label>Montant demandé (FCFA) *</label>
          <input type="number" id="f-montant" placeholder="500000" min="10000" />
        </div>
        <div class="field">
          <label>Durée (mois) *</label>
          <input type="number" id="f-duree" placeholder="12" min="1" max="60" />
        </div>
      </div>
      <div class="field">
        <label>Périodicité *</label>
        <select id="f-periodicite">
          <option value="MENSUEL">Mensuelle</option>
          <option value="HEBDOMADAIRE">Hebdomadaire</option>
        </select>
      </div>
      <div class="field">
        <label>Objet du crédit *</label>
        <textarea id="f-objet" placeholder="Décrivez l'usage prévu du crédit…"></textarea>
      </div>
      <button class="btn btn-primary" onclick="soumettreCredit()" id="btn-submit-credit">Soumettre la demande</button>
    </div>
  </div>

  <script>
    // ═══════════════════════════════════════════════════════════
    // UTILITAIRES
    // ═══════════════════════════════════════════════════════════

    let evalConvId = null;
    let evalNpsChoisi = null;
    let evalSatisChoisie = null;

    function ouvrirModalEvaluation(convId) {
      evalConvId = convId;
      evalNpsChoisi = null;
      evalSatisChoisie = null;
      document.getElementById('eval-commentaire').value = '';

      // Générer les boutons NPS 0-10
      const npsZone = document.getElementById('nps-buttons');
      npsZone.innerHTML = Array.from({ length: 11 }, (_, i) => `
    <button onclick="choisirNps(${i})" id="nps-btn-${i}"
      style="width:38px;height:38px;border-radius:8px;border:1.5px solid #D5D8DC;
             background:#fff;font-weight:700;cursor:pointer;font-size:13px;transition:all .15s">
      ${i}
    </button>`).join('');

      // Générer les étoiles 1-5
      const starsZone = document.getElementById('stars-buttons');
      starsZone.innerHTML = Array.from({ length: 5 }, (_, i) => `
    <span onclick="choisirSatisfaction(${i + 1})" id="star-${i + 1}"
      style="cursor:pointer;color:#D5D8DC;transition:color .15s">★</span>`).join('');

      ouvrirModal('modal-evaluation');
    }

    function choisirNps(valeur) {
      evalNpsChoisi = valeur;
      for (let i = 0; i <= 10; i++) {
        const btn = document.getElementById(`nps-btn-${i}`);
        if (i === valeur) {
          btn.style.background = i >= 9 ? 'var(--vert)' : i >= 7 ? 'var(--or)' : 'var(--rouge)';
          btn.style.color = '#fff';
          btn.style.borderColor = 'transparent';
        } else {
          btn.style.background = '#fff';
          btn.style.color = '#2C3E50';
          btn.style.borderColor = '#D5D8DC';
        }
      }
    }

    function choisirSatisfaction(valeur) {
      evalSatisChoisie = valeur;
      for (let i = 1; i <= 5; i++) {
        document.getElementById(`star-${i}`).style.color =
          i <= valeur ? 'var(--or)' : '#D5D8DC';
      }
    }

    async function soumettreEvaluation() {
      if (evalNpsChoisi === null) {
        toast('Veuillez choisir une note NPS (0 à 10).', 'error'); return;
      }
      if (evalSatisChoisie === null) {
        toast('Veuillez choisir une note de satisfaction (1 à 5 étoiles).', 'error'); return;
      }

      const btn = document.getElementById('btn-eval-submit');
      btn.disabled = true;
      btn.innerHTML = '<span class="spinner"></span> Envoi…';

      try {
        const r = await API('/chat/evaluations/', {
          method: 'POST',
          body: JSON.stringify({
            conversation: evalConvId,
            note_nps: evalNpsChoisi,
            note_satisfaction: evalSatisChoisie,
            commentaire: document.getElementById('eval-commentaire').value.trim(),
          }),
        });
        const d = await r.json();
        if (!r.ok) throw new Error(Object.values(d).flat().join(' '));

        toast('Merci pour votre évaluation !', 'success');
        fermerModal('modal-evaluation');
        chargerConversations();
      } catch (e) {
        toast(e.message, 'error');
      } finally {
        btn.disabled = false;
        btn.textContent = 'Envoyer mon évaluation';
      }
    }
    const API = (path, opts = {}) => {
      const token = localStorage.getItem('token');
      return fetch('/api' + path, {
        ...opts,
        cache: 'no-store',
        headers: {
          'Cache-Control': 'no-cache',
          'Pragma': 'no-cache',
          ...(opts.headers || {}),
          ...(token ? { 'Authorization': `Bearer ${token}` } : {}),
          ...(opts.body && !(opts.body instanceof FormData)
            ? { 'Content-Type': 'application/json' } : {}),
        },
      });
    };

    function toast(msg, type = '') {
      const t = document.getElementById('toast');
      t.textContent = msg; t.className = 'show ' + type;
      setTimeout(() => t.className = '', 3000);
    }

    function badgeStatut(s) {
      return `<span class="badge-statut badge-${s}">${s.replace('_', ' ')}</span>`;
    }

    function formatDate(d) {
      if (!d) return '—';
      return new Date(d).toLocaleDateString('fr-CI');
    }

    function formatMontant(n) {
      return Number(n).toLocaleString('fr-CI') + ' FCFA';
    }

    function fermerModal(id) { document.getElementById(id).classList.remove('open'); }
    function ouvrirModal(id) { document.getElementById(id).classList.add('open'); }

    function seDeconnecter() {
      localStorage.clear();
      window.location.href = '/login/';
    }

    // ═══════════════════════════════════════════════════════════
    // INIT
    // ═══════════════════════════════════════════════════════════
    const profil = JSON.parse(localStorage.getItem('profil') || 'null');
    if (!profil) { window.location.href = '/login/'; }

    function userIdFromJwt() {
      try {
        const t = localStorage.getItem('token');
        if (!t) return null;
        const b64 = t.split('.')[1].replace(/-/g, '+').replace(/_/g, '/');
        return JSON.parse(atob(b64)).user_id;
      } catch(e) { return null; }
    }
    const estAdmin = profil && (profil.role === 'ADMIN' || profil.role === 'AGENT');

    // Remplir l'en-tête sidebar
    document.getElementById('nav-avatar').textContent =
      (profil.first_name?.[0] || '') + (profil.last_name?.[0] || '');
    document.getElementById('nav-username').textContent =
      profil.first_name + ' ' + profil.last_name;
    document.getElementById('nav-role').textContent = profil.role;
    document.getElementById('topbar-name').textContent =
      profil.first_name + ' ' + profil.last_name;

    // Navigation selon le rôle
    const navClient = [
      { icon: '', label: 'Tableau de bord', page: 'dashboard' },
      { icon: '', label: 'Mes crédits', page: 'credits' },
      { icon: '', label: 'Assurance', page: 'assurance' },
      { icon: '', label: 'Notifications', page: 'notifications' },
      { icon: '', label: 'Support chat', page: 'chat' },
    ];
    const navAdmin = [
      { icon: '', label: 'Tableau de bord', page: 'dashboard' },
      { icon: '', label: 'Dossiers crédits', page: 'gestion-credits' },
      { icon: '', label: 'Crédits', page: 'credits' },
      { icon: '', label: 'Remboursements', page: 'remboursements' },
      { icon: '', label: 'Assurance', page: 'assurance' }, { icon: '', label: 'Support chat', page: 'chat' },
      { icon: '', label: 'Notifications', page: 'notifications' },
    ];
    const navItems = estAdmin ? navAdmin : navClient;
    const navEl = document.getElementById('nav-links');
    navItems.forEach(item => {
      const a = document.createElement('a');
      a.className = 'nav-item'; a.dataset.page = item.page;
      a.innerHTML = `<span class="icon">${item.icon}</span>${item.label}`;
      a.onclick = (e) => { e.preventDefault(); afficherPage(item.page); };
      navEl.appendChild(a);
    });

    // Charger le nombre de notifications non lues
    async function chargerNotifCount() {
      try {
        const r = await API('/notifications/');
        if (!r.ok) return;
        const d = await r.json();
        const items = d.results || d;
        // Filtrer uniquement les vraies non-lues avec un titre
        const nonLues = items.filter(n => !n.est_lu && n.titre).length;
        const badge = document.getElementById('notif-count');
        if (nonLues > 0) {
          badge.textContent = nonLues;
          badge.style.display = 'flex';
        } else {
          badge.style.display = 'none';
        }
      } catch (e) { }
    }
    chargerNotifCount();

    // ═══════════════════════════════════════════════════════════
    // ROUTER
    // ═══════════════════════════════════════════════════════════
    function afficherPage(page) {
      // Arrêter le rafraîchissement du chat si on change de page
      if (window._chatRefreshInterval) {
        clearInterval(window._chatRefreshInterval);
        window._chatRefreshInterval = null;
      }
      document.querySelectorAll('.nav-item').forEach(a => a.classList.remove('active'));
      document.querySelector(`[data-page="${page}"]`)?.classList.add('active');
      const pages = {
        dashboard: estAdmin ? pageDashboardAdmin : pageDashboardClient,
        'gestion-credits': pageGestionCredits,
        credits: pageCredits,
        assurance: pageAssurance,
        notifications: pageNotifications,
        chat: pageChat,
        remboursements: pageRemboursements,
      };
      (pages[page] || pageDashboardClient)();
    }

    // ═══════════════════════════════════════════════════════════
    // PAGE : DASHBOARD CLIENT
    // ═══════════════════════════════════════════════════════════
    async function pageDashboardClient() {
      document.getElementById('page-title').textContent = 'Tableau de bord';
      const c = document.getElementById('page-content');
      c.innerHTML = `
    <div style="margin-bottom:8px;font-size:18px;font-weight:700;color:var(--bleu)">
      Bonjour, ${profil.first_name} ${profil.last_name} 
    </div>
    <div style="color:var(--gris);font-size:13px;margin-bottom:24px">
      Bienvenue sur votre espace COFINANCE CI
    </div>
    <div class="stat-grid">
      <div class="stat-card"><div class="stat-label">Crédits</div><div class="stat-value" id="s-credits">…</div></div>
      <div class="stat-card or"><div class="stat-label">Assurances actives</div><div class="stat-value" id="s-assurances">…</div></div>
      <div class="stat-card vert"><div class="stat-label">Notifications non lues</div><div class="stat-value" id="s-notifs">…</div></div>
    </div>

    <div class="section-title">
      Mes crédits récents
      ${!estAdmin ? `<button class="btn btn-primary btn-sm" onclick="ouvrirModal('modal-credit')">+ Nouveau crédit</button>` : ''}
    </div>
    <div class="card" id="credits-rapide">
      <div class="empty-state"><div class="icon">⏳</div><p>Chargement…</p></div>
    </div>

    <!-- ← Zone de détail AJOUTÉE ici -->
    <div id="detail-credit-zone"></div>
  `;

      // Charger stats
      try {
        const [rc, ra, rn] = await Promise.all([
          API('/credits/demandes/'),
          API('/assurance/mes-souscriptions/'),
          API('/notifications/'),
        ]);
        const [credits, assurances, notifs] = await Promise.all([rc.json(), ra.json(), rn.json()]);
        const cl = (credits.results || credits);
        const al = (assurances.results || assurances);
        const nl = (notifs.results || notifs);

        document.getElementById('s-credits').textContent = cl.length;
        document.getElementById('s-assurances').textContent = al.length;
        document.getElementById('s-notifs').textContent = nl.filter(n => !n.est_lu).length;

        // Crédits récents
        if (cl.length === 0) {
          document.getElementById('credits-rapide').innerHTML = `
        <div class="empty-state">
          <div class="icon"></div>
          <p>Aucun crédit pour l'instant.</p>
          <button class="btn btn-primary" style="margin-top:14px" onclick="ouvrirModal('modal-credit')">Faire une demande</button>
        </div>`;
        } else {
          document.getElementById('credits-rapide').innerHTML = `
        <div class="table-wrap">
        <table>
          <thead><tr><th>#</th><th>Montant</th><th>Durée</th><th>Statut</th><th>Date</th><th></th></tr></thead>
          <tbody>
            ${cl.slice(0, 5).map(cr => `
              <tr>
                <td><strong>#${cr.id}</strong></td>
                <td>${formatMontant(cr.montant_demande)}</td>
                <td>${cr.duree_mois} mois</td>
                <td>${badgeStatut(cr.statut)}</td>
                <td>${formatDate(cr.date_soumission)}</td>
                <td><button class="btn btn-outline btn-sm" onclick="voirDetailCredit(${cr.id})">Voir</button></td>
              </tr>`).join('')}
          </tbody>
        </table></div>`;
        }
      } catch (e) { console.error(e); }
    }

    // AJOUTER dans le bloc <script> de app.html

    async function pageGestionCredits() {
      document.getElementById('page-title').textContent = 'Gestion des crédits';
      const c = document.getElementById('page-content');
      c.innerHTML = `
    <div class="tabs">
      <div class="tab active" onclick="switchTabGlobal(event,'t-tous-credits')"> Tous les dossiers</div>
      <div class="tab" onclick="switchTabGlobal(event,'t-en-attente')">⏳ En attente</div>
    </div>
    <div class="tab-content active" id="t-tous-credits">
      <div class="empty-state"><div class="icon">⏳</div><p>Chargement…</p></div>
    </div>
    <div class="tab-content" id="t-en-attente">
      <div class="empty-state"><div class="icon">⏳</div><p>Chargement…</p></div>
    </div>
    <div id="detail-credit-zone"></div>
  `;
      await chargerTousLesCredits();
    }

    async function chargerTousLesCredits() {
      try {
        const r = await API('/credits/demandes/');
        const d = await r.json();
        const credits = d.results || d;

        const tous = credits;
        const enAttente = credits.filter(cr =>
          ['SOUMISE', 'EN_ANALYSE'].includes(cr.statut)
        );

        // Fonction commune pour rendre le tableau
        const renderTable = (liste) => liste.length === 0
          ? '<div class="empty-state"><div class="icon"></div><p>Aucun dossier.</p></div>'
          : `<div class="table-wrap"><table>
          <thead>
            <tr>
              <th>#</th><th>Client</th><th>Montant</th><th>Durée</th>
              <th>Score</th><th>Statut</th><th>Date</th><th>Actions</th>
            </tr>
          </thead>
          <tbody>
            ${liste.map(cr => `
              <tr>
                <td><strong>#${cr.id}</strong></td>
                <td>${cr.client_nom || '—'}</td>
                <td>${formatMontant(cr.montant_demande)}</td>
                <td>${cr.duree_mois} mois</td>
                <td>
                  <strong style="color:${cr.score_eligibilite >= 70 ? 'var(--vert)' :
              cr.score_eligibilite >= 50 ? 'var(--or)' : 'var(--rouge)'
            }">
                    ${cr.score_eligibilite ?? '—'}/100
                  </strong>
                </td>
                <td>${badgeStatut(cr.statut)}</td>
                <td>${formatDate(cr.date_soumission)}</td>
                <td>
                  <button class="btn btn-outline btn-sm"
                    onclick="voirDetailCreditAdmin(${cr.id})">
                    Voir
                  </button>
                  ${cr.statut === 'SOUMISE' ? `
                    <button class="btn btn-primary btn-sm" style="margin-left:4px"
                      onclick="changerStatutCredit(${cr.id},'EN_ANALYSE','')">
                      Prendre en charge
                    </button>` : ''}
                  ${cr.statut === 'EN_ANALYSE' ? `
                    <button class="btn btn-success btn-sm" style="margin-left:4px"
                      onclick="ouvrirModalValidation(${cr.id},'APPROUVEE')">
                       Approuver
                    </button>
                    <button class="btn btn-danger btn-sm" style="margin-left:4px"
                      onclick="ouvrirModalValidation(${cr.id},'REJETEE')">
                       Rejeter
                    </button>` : ''}
                  ${cr.statut === 'APPROUVEE' ? `
                    <button class="btn btn-success btn-sm" style="margin-left:4px"
                      onclick="changerStatutCredit(${cr.id},'DECAISSEE','Fonds décaissés')">
                       Décaisser
                    </button>` : ''}
                </td>
              </tr>`).join('')}
          </tbody>
        </table></div>`;

        document.getElementById('t-tous-credits').innerHTML = renderTable(tous);
        document.getElementById('t-en-attente').innerHTML = renderTable(enAttente);
      } catch (e) { console.error(e); }
    }

    async function voirDetailCreditAdmin(id) {
      // Réutilise la même fonction que côté client
      await voirDetailCredit(id);
    }

    function ouvrirModalValidation(creditId, nouveauStatut) {
      // Créer la modale dynamiquement si elle n'existe pas
      let modal = document.getElementById('modal-validation-credit');
      if (!modal) {
        modal = document.createElement('div');
        modal.id = 'modal-validation-credit';
        modal.className = 'modal-overlay';
        modal.innerHTML = `
      <div class="modal">
        <div class="modal-title">
          <span id="mv-titre">Validation du crédit</span>
          <span class="modal-close"
            onclick="document.getElementById('modal-validation-credit').classList.remove('open')">×</span>
        </div>
        <div id="mv-champ-montant" style="display:none">
          <div class="field">
            <label>Montant approuvé (FCFA) *</label>
            <input type="number" id="mv-montant"
                   placeholder="Peut différer du montant demandé" />
          </div>
        </div>
        <div class="field">
          <label>Commentaire</label>
          <textarea id="mv-commentaire"
                    placeholder="Motif de la décision…"></textarea>
        </div>
        <button class="btn btn-primary" id="mv-btn-confirmer"
                onclick="confirmerValidation()">
          Confirmer
        </button>
      </div>`;
        document.body.appendChild(modal);
      }

      // Stocker les infos dans des attributs data
      modal.dataset.creditId = creditId;
      modal.dataset.nouveauStatut = nouveauStatut;

      // Adapter le contenu selon l'action
      if (nouveauStatut === 'APPROUVEE') {
        document.getElementById('mv-titre').textContent = ' Approuver le crédit';
        document.getElementById('mv-champ-montant').style.display = 'block';
        document.getElementById('mv-btn-confirmer').className = 'btn btn-success';
        document.getElementById('mv-btn-confirmer').textContent = ' Confirmer l\'approbation';
      } else {
        document.getElementById('mv-titre').textContent = ' Rejeter le crédit';
        document.getElementById('mv-champ-montant').style.display = 'none';
        document.getElementById('mv-btn-confirmer').className = 'btn btn-danger';
        document.getElementById('mv-btn-confirmer').textContent = ' Confirmer le rejet';
      }

      modal.classList.add('open');
    }

    async function confirmerValidation() {
      const modal = document.getElementById('modal-validation-credit');
      const creditId = modal.dataset.creditId;
      const nouveauStatut = modal.dataset.nouveauStatut;
      const commentaire = document.getElementById('mv-commentaire').value.trim();
      const montantEl = document.getElementById('mv-montant');

      const payload = { statut: nouveauStatut, commentaire_agent: commentaire };

      if (nouveauStatut === 'APPROUVEE') {
        if (!montantEl.value) {
          toast('Veuillez saisir le montant approuvé.', 'error'); return;
        }
        payload.montant_approuve = montantEl.value;
      }

      const btn = document.getElementById('mv-btn-confirmer');
      btn.disabled = true;
      btn.innerHTML = '<span class="spinner"></span> Traitement…';

      try {
        const r = await API(`/credits/demandes/${creditId}/statut/`, {
          method: 'PATCH',
          body: JSON.stringify(payload),
        });
        const d = await r.json();
        if (!r.ok) throw new Error(d.statut || JSON.stringify(d));

        toast(
          nouveauStatut === 'APPROUVEE'
            ? ' Crédit approuvé avec succès !'
            : ' Crédit rejeté.',
          nouveauStatut === 'APPROUVEE' ? 'success' : 'error'
        );
        modal.classList.remove('open');
        await chargerTousLesCredits();

      } catch (e) {
        toast(e.message, 'error');
      } finally {
        btn.disabled = false;
        btn.textContent = 'Confirmer';
      }
    }

    async function changerStatutCredit(creditId, statut, commentaire) {
      try {
        const r = await API(`/credits/demandes/${creditId}/statut/`, {
          method: 'PATCH',
          body: JSON.stringify({ statut, commentaire_agent: commentaire }),
        });
        const d = await r.json();

      } catch (e) {
        toast(e.message, 'error');
      }

    async function uploadPiece(demandeId, input) {
      const file = input.files[0];
      if (!file) return;
      const type = document.getElementById(`type-doc-${demandeId}`).value;
      const fd = new FormData();
      fd.append('fichier', file);
      fd.append('type_document', type);
      fd.append('demande', demandeId);

      toast('Upload en cours…');
      try {
        const r = await API(`/credits/demandes/${demandeId}/pieces/upload/`, {
          method: 'POST', body: fd,
        });
        const d = await r.json();
        if (!r.ok) throw new Error(JSON.stringify(d));
        toast('Document uploadé !', 'success');
        // Rafraîchir la liste
        const rp = await API(`/credits/demandes/${demandeId}/pieces/`);
        const pcsData = await rp.json();
        const pcs = pcsData.results || pcsData;
        document.getElementById(`pieces-list-${demandeId}`).innerHTML =
          pcs.map(p => `
        <div class="upload-item">
          <span class="icon"></span>
          <span style="flex:1">${p.nom_original || p.type_document}</span>
          <a href="${p.url_telechargement}" target="_blank" style="font-size:12px;color:var(--bleu2)">Télécharger</a>
        </div>`).join('');
      } catch (e) { toast('Erreur upload : ' + e.message, 'error'); }
    }

    function switchTab(e, targetId) {
      const card = e.target.closest('.card');
      card.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
      card.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
      e.target.classList.add('active');
      card.querySelector('#' + targetId).classList.add('active');
    }

    function switchTabGlobal(e, targetId) {
      document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
      document.querySelectorAll('.tabs .tab').forEach(t => t.classList.remove('active'));
      e.target.classList.add('active');
      document.getElementById(targetId).classList.add('active');
    }

    async function soumettreCredit() {
      const btn = document.getElementById('btn-submit-credit');
      const payload = {
        montant_demande: document.getElementById('f-montant').value,
        duree_mois: document.getElementById('f-duree').value,
        periodicite: document.getElementById('f-periodicite').value,
        objet_credit: document.getElementById('f-objet').value,
      };
      if (!payload.montant_demande || !payload.duree_mois || !payload.objet_credit) {
        toast('Veuillez remplir tous les champs.', 'error'); return;
      }
      btn.disabled = true; btn.innerHTML = '<span class="spinner"></span> Envoi…';
      try {
        const r = await API('/credits/demandes/', { method: 'POST', body: JSON.stringify(payload) });
        const d = await r.json();
        if (!r.ok) throw new Error(Object.values(d).flat().join(' '));
        toast('Demande soumise avec succès !', 'success');
        fermerModal('modal-credit');
        pageCredits();
      } catch (e) { toast(e.message, 'error'); }
      finally { btn.disabled = false; btn.textContent = 'Soumettre la demande'; }
    }

    async function ouvrirConversation(id, sujet) {
      // Fermer le WebSocket précédent proprement
      if (chatSocket) {
        chatSocket.close();
        chatSocket = null;
      }
      chatConvId = id;

      const right = document.getElementById('chat-right');
      right.innerHTML = `
    <div style="padding:12px 16px;border-bottom:1px solid #EEF1F3;font-weight:700;color:var(--bleu);display:flex;align-items:center;justify-content:space-between">
      <span> ${sujet}</span>
      <span style="font-size:11px;color:var(--gris)" id="ws-status"> Connexion…</span>
    </div>
    <div id="messages-zone" style="flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:10px"></div>
    <div id="frappe-zone" style="padding:0 16px 4px;font-size:12px;color:var(--gris);font-style:italic;min-height:18px"></div>
    <div style="padding:12px 16px;border-top:1px solid #EEF1F3;display:flex;gap:8px">
      <input id="msg-input" type="text" placeholder="Écrivez votre message…"
             style="flex:1;border:1.5px solid #D5D8DC;border-radius:24px;padding:10px 16px;font-size:13px;outline:none"
             oninput="sendFrappe()"
             onkeypress="if(event.key==='Enter')envoyerMsg()" />
      <button onclick="envoyerMsg()" style="background:var(--bleu);color:#fff;border:none;border-radius:50%;width:40px;height:40px;cursor:pointer;font-size:16px"></button>
    </div>
  `;

      // Charger historique dans la zone vide
      try {
        const r = await API(`/chat/conversations/${id}/messages/`);
        const d = await r.json();
        (d.results || d).forEach(afficherMsg);
      } catch (e) { }

      // Nouveau WebSocket
      const token = localStorage.getItem('token');
      chatSocket = new WebSocket(`ws://${location.host}/ws/chat/${id}/?token=${token}`);

      chatSocket.onopen = () => {
        document.getElementById('ws-status').textContent = '🟢 En ligne';
      };
      chatSocket.onclose = () => {
        const el = document.getElementById('ws-status');
        if (el) el.textContent = ' Déconnecté';
      };
      chatSocket.onmessage = (e) => {
        const data = JSON.parse(e.data);
        if (data.type === 'message') {
          afficherMsg(data.message);
        } else if (data.type === 'frappe') {
          const fz = document.getElementById('frappe-zone');
          if (fz && parseInt(data.auteur_id ?? data.auteur) !== userIdFromJwt()) {
            fz.textContent = `${data.auteur_nom} est en train d'écrire…`;
            clearTimeout(window._frappTimer);
            window._frappTimer = setTimeout(() => { if (fz) fz.textContent = ''; }, 3000);
          }
        }
      };
    }

    function afficherMsg(msg) {
      const zone = document.getElementById('messages-zone');
      if (!zone) return;
      const moi = parseInt(msg.auteur_id ?? msg.auteur) === userIdFromJwt();
      const heure = new Date(msg.created_at).toLocaleTimeString('fr-CI', { hour: '2-digit', minute: '2-digit' });
      const div = document.createElement('div');
      div.style.cssText = `display:flex;flex-direction:column;align-items:${moi ? 'flex-end' : 'flex-start'}`;
      div.innerHTML = `
    ${!moi ? `<div style="font-size:11px;font-weight:700;color:var(--bleu);margin-bottom:3px">${msg.auteur_nom || 'Agent'}</div>` : ''}
    <div style="max-width:72%;padding:10px 14px;border-radius:${moi ? '12px 12px 4px 12px' : '12px 12px 12px 4px'};background:${moi ? 'var(--bleu)' : 'var(--bg)'};color:${moi ? '#fff' : '#2C3E50'};font-size:13px;line-height:1.4">${msg.contenu}</div>
    <div style="font-size:10px;color:var(--gris);margin-top:3px">${heure}</div>
  `;
      zone.appendChild(div);
      zone.scrollTop = zone.scrollHeight;
    }

    function envoyerMsg() {
      const input = document.getElementById('msg-input');
      const msg = input.value.trim();
      if (!msg || !chatSocket || chatSocket.readyState !== 1) return;
      chatSocket.send(JSON.stringify({ type: 'message', contenu: msg }));
      input.value = '';
    }

    let _frappeSent = false;
    function sendFrappe() {
      if (!chatSocket || chatSocket.readyState !== 1) return;
      if (!_frappeSent) {
        chatSocket.send(JSON.stringify({ type: 'frappe' }));
        _frappeSent = true;
        setTimeout(() => { _frappeSent = false; }, 2000);
      }
    }

    async function nouvelleConversation() {
      const sujet = prompt('Sujet de la conversation :');
      if (!sujet) return;
      try {
        const r = await API('/chat/conversations/', {
          method: 'POST', body: JSON.stringify({ sujet })
        });
        const d = await r.json();
        if (!r.ok) throw new Error(JSON.stringify(d));
        toast('Conversation créée !', 'success');
        await chargerConversations();
        ouvrirConversation(d.id, sujet);
      } catch (e) { toast(e.message, 'error'); }
    }

          method: 'POST',
