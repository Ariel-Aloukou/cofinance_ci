<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>COFINANCE CI — Connexion</title>
<link rel="stylesheet" href="/static/css/premium-theme.css">
<style>
  :root {
    --bleu:    var(--accent-purple);
    --bleu2:   var(--accent-purple-hover);
    --or:      var(--accent-gold);
    --bg:      var(--bg-app);
    --blanc:   var(--bg-card);
    --gris:    var(--text-secondary);
    --rouge:   var(--accent-red);
    --vert:    var(--accent-green);
    --radius:  var(--radius-md);
    --shadow:  var(--shadow-md);
    --bg-input: var(--bg-elevated);
    --border-light: var(--border-subtle);
    --text-primary: var(--text-primary);
    --text-secondary: var(--text-secondary);
    --text-tertiary: var(--text-tertiary);
    --text-on-dark: #fff;
    --brun-doux: var(--accent-purple);
    --brun: var(--accent-purple-hover);
    --brun-tres-fonce: var(--bg-app);
    --brun-fonce: #1a1f2e;
    --or-cuivre: var(--accent-gold);
    --terracotta: var(--accent-red);
    --bg-page: var(--bg-app);
    --bg-card: var(--bg-card);
    --blanc-casse: var(--bg-card);
    --font-display: var(--font-display);
    --radius-xl: var(--radius-xl);
    --shadow-lg: var(--shadow-lg);
    --text-muted: var(--text-tertiary);
    --terracotta-fonce: var(--accent-red);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Segoe UI', sans-serif;
    background: linear-gradient(135deg, var(--brun-tres-fonce) 0%, var(--brun-fonce) 60%, var(--or-cuivre) 100%);
    min-height: 100vh;
    display: flex; align-items: center; justify-content: center;
    padding: 20px;
  }
  .card {
    background: var(--blanc);
    border-radius: var(--radius-xl);
    box-shadow: var(--shadow);
    width: 100%; max-width: 420px;
    overflow: hidden;
  }
  .card-header {
    background: linear-gradient(135deg, var(--brun-tres-fonce), var(--brun-fonce));
    padding: 32px 32px 24px;
    text-align: center;
  }
  .logo { font-family: var(--font-display); font-size: 28px; font-weight: 800; color: var(--text-on-dark); letter-spacing: 1px; }
  .logo span { color: var(--or); }
  .subtitle { color: rgba(255,255,255,0.75); font-size: 13px; margin-top: 4px; }
  .card-body { padding: 32px; }
  .card-body h2 { font-family: var(--font-display); font-size: 20px; color: var(--text-primary); margin-bottom: 24px; font-weight: 700; }
  .field { margin-bottom: 18px; }
  .field label { display: block; font-size: 13px; font-weight: 600; color: var(--text-secondary); margin-bottom: 6px; }
  .field input {
    width: 100%; border: 1.5px solid var(--border-light);
    border-radius: var(--radius); padding: 11px 14px;
    font-size: 14px; outline: none;
    transition: border-color .2s;
    background: var(--bg-input);
  }
  .field input:focus { border-color: var(--accent-purple); box-shadow: 0 0 0 3px var(--accent-purple-dim); }
  .btn {
    width: 100%; padding: 13px;
    background: var(--bleu); color: var(--blanc);
    border: none; border-radius: var(--radius);
    font-size: 15px; font-weight: 700;
    cursor: pointer; transition: background .2s;
    margin-top: 8px;
  }
  .btn:hover { background: var(--bleu2); box-shadow: 0 4px 16px rgba(124,92,252,0.3); }
  .btn:disabled { background: var(--text-muted); cursor: not-allowed; }
  .error-box {
    background: rgba(193,122,110,0.1); color: var(--terracotta-fonce);
    border-radius: var(--radius); padding: 10px 14px;
    font-size: 13px; margin-bottom: 16px; display: none;
    border: 1px solid rgba(193,122,110,0.2);
  }
  .link-row { text-align: center; margin-top: 20px; font-size: 13px; color: var(--text-tertiary); }
  .link-row a { color: var(--bleu2); text-decoration: none; font-weight: 600; position: relative; }
  .link-row a::after { content: ''; position: absolute; bottom: -2px; left: 0; width: 0; height: 1.5px; background: var(--accent-purple); transition: width .3s; }
  .link-row a:hover::after { width: 100%; }
  .link-row a:hover { text-decoration: none; }
  .spinner {
    display: inline-block; width: 16px; height: 16px;
    border: 2px solid rgba(255,255,255,0.4);
    border-top-color: #fff;
    border-radius: 50%;
    animation: spin .7s linear infinite;
    vertical-align: middle; margin-right: 6px;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>
<div class="card">
  <div class="card-header">
    <div class="logo">COFINANCE <span>CI</span></div>
    <div class="subtitle">Microfinance & Assurance Mobile</div>
  </div>
  <div class="card-body">
    <h2>Connexion</h2>
    <div class="error-box" id="error-box"></div>
    <div class="field">
      <label>Nom d'utilisateur</label>
      <input type="text" id="username" placeholder="ex: aya_kone" autocomplete="username" />
    </div>
    <div class="field">
      <label>Mot de passe</label>
      <input type="password" id="password" placeholder="••••••••" autocomplete="current-password"
             onkeypress="if(event.key==='Enter') seConnecter()" />
    </div>
    <button class="btn" id="btn-login" onclick="seConnecter()">Se connecter</button>
    <div class="link-row">
      Pas encore inscrit ? <a href="/register/">Créer un compte</a>
    </div>
  </div>
</div>

<script>
async function seConnecter() {
  localStorage.clear();
  const username = document.getElementById('username').value.trim();
  const password = document.getElementById('password').value.trim();
  const errBox   = document.getElementById('error-box');
  const btn      = document.getElementById('btn-login');

  errBox.style.display = 'none';
  if (!username || !password) {
    errBox.textContent = 'Veuillez remplir tous les champs.';
    errBox.style.display = 'block'; return;
  }

  btn.disabled = true;
  btn.innerHTML = '<span class="spinner"></span> Connexion…';

  try {
    const r = await fetch('/api/auth/login/', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ username, password }),
    });
    const data = await r.json();
    if (!r.ok) throw new Error(data.detail || 'Identifiants incorrects.');

    localStorage.setItem('token',   data.access);
    localStorage.setItem('refresh', data.refresh);

    // Récupérer le profil pour connaître le rôle
    const rp = await fetch('/api/auth/profil/', {
      headers: {
          'Authorization': `Bearer ${data.access}`,
          'Cache-Control': 'no-cache',
          'Pragma': 'no-cache'
      },
      cache: 'no-store'
    });
    const profil = await rp.json();
    localStorage.setItem('profil', JSON.stringify(profil));

    // Redirection selon le rôle
    if (profil.role === 'ADMIN' || profil.role === 'AGENT') {
      window.location.href = '/dashboard-admin/';
    } else {
      window.location.href = '/dashboard/';
    }
  } catch(e) {
    errBox.textContent = e.message;
    errBox.style.display = 'block';
    btn.disabled = false;
    btn.textContent = 'Se connecter';
  }
}

// Si déjà connecté, rediriger
const token = localStorage.getItem('token');
if (token) {
  // Vérifier si le token est encore valide avant de rediriger
  fetch('/api/auth/profil/', {
    headers: { 'Authorization': `Bearer ${token}` }
  }).then(r => {
    if (r.ok) {
      r.json().then(profil => {
        window.location.href =
          profil.role === 'ADMIN' || profil.role === 'AGENT'
          ? '/dashboard-admin/' : '/dashboard/';
      });
    } else {
      // Token expiré — nettoyer et rester sur login
      localStorage.clear();
    }
  }).catch(() => localStorage.clear());
}
</script>
</body>
</html>
