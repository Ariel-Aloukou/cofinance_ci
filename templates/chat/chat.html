<!DOCTYPE html>
<html lang="fr">

<head>
  <meta charset="UTF-8">
  <title>COFINANCE CI — Support Client</title>
  <link rel="stylesheet" href="/static/css/cofinance-theme.css">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: var(--font-body);
      background: var(--bg-page);
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .chat-container {
      width: 500px;
      height: 650px;
      background: var(--bg-card);
      border-radius: var(--radius-xl);
      box-shadow: var(--shadow-lg);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .chat-header {
      background: linear-gradient(135deg, var(--brun-tres-fonce), var(--brun-fonce));
      color: var(--text-on-dark);
      padding: 16px 20px;
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .chat-header h2 {
      font-family: var(--font-display);
      font-size: 16px;
      font-weight: 700;
    }

    .chat-header span {
      font-size: 12px;
      opacity: 0.8;
    }

    .status-dot {
      width: 10px;
      height: 10px;
      background: var(--terracotta);
      border-radius: 50%;
      flex-shrink: 0;
    }

    .messages-zone {
      flex: 1;
      padding: 16px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .message {
      max-width: 75%;
      padding: 10px 14px;
      border-radius: 12px;
      font-size: 14px;
      line-height: 1.4;
      animation: fadeInUp 0.3s var(--ease-out);
    }

    .message.moi {
      align-self: flex-end;
      background: linear-gradient(135deg, var(--brun-doux), var(--brun));
      color: var(--text-on-dark);
      border-bottom-right-radius: 4px;
    }

    .message.autre {
      align-self: flex-start;
      background: var(--beige);
      color: var(--text-primary);
      border-bottom-left-radius: 4px;
    }

    .message .auteur {
      font-size: 11px;
      font-weight: 600;
      margin-bottom: 4px;
      opacity: 0.7;
    }

    .message.moi .auteur { color: rgba(255,255,255,0.75); }
    .message.autre .auteur { color: var(--text-tertiary); }

    .message .heure {
      font-size: 10px;
      margin-top: 4px;
      opacity: 0.6;
      text-align: right;
    }

    .frappe-indicator {
      font-size: 12px;
      color: var(--text-tertiary);
      font-style: italic;
      padding: 0 16px 8px;
      min-height: 20px;
    }

    .input-zone {
      padding: 12px 16px;
      border-top: 1px solid var(--border-light);
      display: flex;
      gap: 8px;
      background: var(--bg-card);
    }

    .input-zone input {
      flex: 1;
      border: 1.5px solid var(--border-light);
      border-radius: 24px;
      padding: 10px 16px;
      font-size: 14px;
      outline: none;
      transition: border-color 0.2s;
      background: var(--bg-input);
    }

    .input-zone input:focus {
      border-color: var(--brun-doux);
      box-shadow: 0 0 0 3px rgba(139,115,85,0.15);
    }

    .input-zone button {
      background: var(--brun-doux);
      color: var(--text-on-dark);
      border: none;
      border-radius: 50%;
      width: 42px;
      height: 42px;
      cursor: pointer;
      font-size: 18px;
      transition: background 0.2s, transform 0.2s;
    }

    .input-zone button:hover {
      background: var(--brun);
      transform: scale(1.05);
    }

    .login-zone {
      padding: 24px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .login-zone h3 {
      font-family: var(--font-display);
      color: var(--brun-fonce);
      margin-bottom: 8px;
    }

    .login-zone input {
      border: 1.5px solid var(--border-light);
      border-radius: var(--radius-md);
      padding: 10px 14px;
      font-size: 14px;
      outline: none;
      background: var(--bg-input);
      transition: border-color 0.2s;
    }

    .login-zone input:focus {
      border-color: var(--brun-doux);
      box-shadow: 0 0 0 3px rgba(139,115,85,0.15);
    }

    .login-zone button {
      background: var(--brun-doux);
      color: var(--text-on-dark);
      border: none;
      border-radius: var(--radius-md);
      padding: 12px;
      cursor: pointer;
      font-weight: 600;
      transition: background 0.2s;
    }

    .login-zone button:hover {
      background: var(--brun);
    }

    .error {
      color: var(--terracotta-fonce);
      font-size: 13px;
    }
  </style>
</head>

<body>
  <div class="chat-container">

    <!-- Zone de connexion -->
    <div id="login-zone" class="login-zone">
      <h3> Connexion COFINANCE CI</h3>
      <input type="text" id="username" placeholder="Nom d'utilisateur" />
      <input type="password" id="password" placeholder="Mot de passe" />
      <input type="number" id="conv-id" placeholder="ID de conversation (ex: 1)" />
      <button onclick="seConnecter()">Se connecter</button>
      <p id="erreur-login" class="error"></p>
    </div>

    <!-- Zone de chat (cachée par défaut) -->
    <div id="chat-zone" style="display:none; flex-direction:column; height:100%;">
      <div class="chat-header">
        <div class="status-dot" id="status-dot"></div>
        <div>
          <h2>Support Client COFINANCE CI</h2>
          <span id="nom-utilisateur"></span>
        </div>
      </div>
      <div class="messages-zone" id="messages-zone"></div>
      <div class="frappe-indicator" id="frappe-indicator"></div>
      <div class="input-zone">
        <form id="send-form" style="display:flex;flex:1;gap:8px">
          <input type="text" id="message-input" placeholder="Écrivez votre message..." oninput="signalerFrappe()" />
          <button type="submit"></button>
        </form>
      </div>
    </div>

  </div>

  <script>
    let socket = null;
    let token = null;
    let monUserId = null;
    let monNom = null;
    let frappTimer = null;

    async function seConnecter() {
      const username = document.getElementById('username').value.trim();
      const password = document.getElementById('password').value.trim();
      const convId = document.getElementById('conv-id').value.trim();
      const erreur = document.getElementById('erreur-login');
      erreur.textContent = '';

      if (!username || !password || !convId) {
        erreur.textContent = 'Tous les champs sont obligatoires.';
        return;
      }

      try {
        // 1. Obtenir le token JWT
        const respLogin = await fetch('/api/auth/login/', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, password }),
        });
        if (!respLogin.ok) throw new Error('Identifiants incorrects.');
        const dataLogin = await respLogin.json();
        token = dataLogin.access;

        // 2. Récupérer le profil — DOIT être fait AVANT tout le reste
        const respProfil = await fetch('/api/auth/profil/', {
          headers: { 'Authorization': `Bearer ${token}` },
        });
        const profil = await respProfil.json();

        // Stocker l'ID comme entier — c'est la clé du bug
        monUserId = parseInt(profil.id);
        monNom = `${profil.first_name} ${profil.last_name}`;

        console.log("Connecté en tant que :", monNom, "| ID :", monUserId);

        // 3. Charger l'historique
        await chargerHistorique(convId);

        // 4. Ouvrir WebSocket
        connecterWebSocket(convId);

        // 5. Afficher la zone de chat
        document.getElementById('login-zone').style.display = 'none';
        const chatZone = document.getElementById('chat-zone');
        chatZone.style.display = 'flex';
        chatZone.style.flexDirection = 'column';
        chatZone.style.height = '100%';
        document.getElementById('nom-utilisateur').textContent = monNom;

      } catch (e) {
        document.getElementById('erreur-login').textContent = e.message;
      }
    }

    async function chargerHistorique(convId) {
      const resp = await fetch(`/api/chat/conversations/${convId}/messages/`, {
        headers: { 'Authorization': `Bearer ${token}` },
      });
      const data = await resp.json();
      const messages = data.results || data;

      document.getElementById('messages-zone').innerHTML = '';

      messages.forEach(m => {
        console.log("Historique — auteur:", m.auteur, "| monUserId:", monUserId, "| estMoi:", parseInt(m.auteur) === monUserId);
        afficherMessage(m);
      });
    }

    function connecterWebSocket(convId) {
      const proto = window.location.protocol === 'https:' ? 'wss' : 'ws';

      // On passe le token JWT dans l'URL
      socket = new WebSocket(
        `${proto}://${window.location.host}/ws/chat/${convId}/?token=${token}`
      );

      socket.onopen = () => {
        document.getElementById('status-dot').style.background = '#2ecc71';
        console.log("WebSocket connecté");
      };

      socket.onclose = () => {
        document.getElementById('status-dot').style.background = '#e74c3c';
        console.log("WebSocket déconnecté");
      };

      socket.onmessage = (event) => {
        const data = JSON.parse(event.data);
        console.log("WebSocket reçu :", data);

        if (data.type === 'message') {
          afficherMessage(data.message);
          document.getElementById('frappe-indicator').textContent = '';

        } else if (data.type === 'frappe') {
          if (parseInt(data.auteur_id) !== monUserId) {
            document.getElementById('frappe-indicator').textContent =
              `${data.auteur_nom} est en train d'écrire...`;
            clearTimeout(frappTimer);
            frappTimer = setTimeout(() => {
              document.getElementById('frappe-indicator').textContent = '';
            }, 3000);
          }
        }
      };
    }

    function afficherMessage(msg) {
      const zone = document.getElementById('messages-zone');

      const auteurId = parseInt(msg.auteur_id !== undefined ? msg.auteur_id : msg.auteur);
      const estMoi = auteurId === monUserId;

      console.log(`Message: "${msg.contenu}" | auteurId: ${auteurId} | monUserId: ${monUserId} | estMoi: ${estMoi}`);

      const div = document.createElement('div');
      div.className = `message ${estMoi ? 'moi' : 'autre'}`;

      const heure = new Date(msg.created_at).toLocaleTimeString('fr-CI', {
        hour: '2-digit', minute: '2-digit',
      });

      div.innerHTML = `
            ${!estMoi ? `<div class="auteur">${msg.auteur_nom || 'Interlocuteur'}</div>` : ''}
            <div>${msg.contenu}</div>
            <div class="heure">${heure}</div>
        `;

      zone.appendChild(div);
      zone.scrollTop = zone.scrollHeight;
    }

    let sending = false;

    document.getElementById('send-form').addEventListener('submit', function(e) {
      e.preventDefault();
      envoyerMessage();
    });

    function envoyerMessage() {
      if (sending) return;
      const input = document.getElementById('message-input');
      const contenu = input.value.trim();

      if (!contenu) return;
      if (!socket || socket.readyState !== WebSocket.OPEN) {
        alert('Connexion WebSocket perdue. Rechargez la page.');
        return;
      }

      sending = true;
      socket.send(JSON.stringify({ type: 'message', contenu }));
      input.value = '';
      sending = false;
    }

    function signalerFrappe() {
      if (socket && socket.readyState === WebSocket.OPEN) {
        socket.send(JSON.stringify({ type: 'frappe' }));
      }
    }
  </script>
</body>

</html>
