<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>COFINANCE CI — Inscription</title>
<link rel="stylesheet" href="/static/css/premium-theme.css">
<style>
  :root { --bleu:var(--accent-purple); --bleu2:var(--accent-purple-hover); --or:var(--accent-gold); --rouge:var(--accent-red); --vert:var(--accent-green); --radius:var(--radius-md); --brun-doux:var(--accent-purple); --brun:var(--accent-purple-hover); --brun-tres-fonce:var(--bg-app); --brun-fonce:#1a1f2e; --or-cuivre:var(--accent-gold); --terracotta:var(--accent-red); --vert-olive:var(--accent-green); --bg-card:var(--bg-card); --border-light:var(--border-subtle); --bg-input:var(--bg-elevated); --text-primary:var(--text-primary); --text-secondary:var(--text-secondary); --text-tertiary:var(--text-tertiary); --text-muted:var(--text-tertiary); --text-on-dark:#fff; --font-display:var(--font-display); --radius-xl:var(--radius-xl); --shadow-lg:var(--shadow-lg); --terracotta-fonce:var(--accent-red); --vert-olive-fonce:var(--accent-green); --blanc-casse:var(--bg-card); --bg-page:var(--bg-app); }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Segoe UI', sans-serif;
    background: linear-gradient(135deg, var(--brun-tres-fonce) 0%, var(--brun-fonce) 60%, var(--or-cuivre) 100%);
    min-height: 100vh; display: flex; align-items: center;
    justify-content: center; padding: 20px;
  }
  .card { background: var(--bg-card); border-radius: var(--radius-xl); box-shadow: var(--shadow-lg); width: 100%; max-width: 500px; overflow: hidden; }
  .card-header { background: linear-gradient(135deg, var(--brun-tres-fonce), var(--brun-fonce)); padding: 28px 32px 20px; text-align: center; }
  .logo { font-family: var(--font-display); font-size: 26px; font-weight: 800; color: var(--text-on-dark); }
  .logo span { color: var(--or); }
  .subtitle { color: rgba(255,255,255,0.7); font-size: 12px; margin-top: 4px; }
  .card-body { padding: 28px 32px 32px; }
  .card-body h2 { font-family: var(--font-display); font-size: 19px; color: var(--text-primary); margin-bottom: 20px; font-weight: 700; }
  .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
  .field { margin-bottom: 14px; }
  .field label { display: block; font-size: 12px; font-weight: 600; color: var(--text-secondary); margin-bottom: 5px; }
  .field input, .field select {
    width: 100%; border: 1.5px solid var(--border-light); border-radius: var(--radius);
    padding: 10px 13px; font-size: 13px; outline: none; transition: border-color .2s;
    background: var(--bg-input);
  }
  .field input:focus, .field select:focus { border-color: var(--accent-purple); box-shadow: 0 0 0 3px var(--accent-purple-dim); }
  .btn { width: 100%; padding: 13px; background: var(--bleu); color: var(--text-on-dark); border: none; border-radius: var(--radius); font-size: 15px; font-weight: 700; cursor: pointer; transition: background .2s; margin-top: 6px; }
  .btn:hover { background: var(--bleu2); box-shadow: 0 4px 16px rgba(124,92,252,0.3); }
  .btn:disabled { background: var(--text-muted); cursor: not-allowed; }
  .error-box { background: rgba(193,122,110,0.1); color: var(--terracotta-fonce); border-radius: var(--radius); padding: 10px 14px; font-size: 13px; margin-bottom: 14px; display: none; border: 1px solid rgba(193,122,110,0.2); }
  .success-box { background: rgba(156,175,136,0.1); color: var(--vert-olive-fonce); border-radius: var(--radius); padding: 10px 14px; font-size: 13px; margin-bottom: 14px; display: none; border: 1px solid rgba(156,175,136,0.2); }
  .link-row { text-align: center; margin-top: 16px; font-size: 13px; color: var(--text-tertiary); }
  .link-row a { color: var(--bleu2); text-decoration: none; font-weight: 600; position: relative; }
  .link-row a::after { content: ''; position: absolute; bottom: -2px; left: 0; width: 0; height: 1.5px; background: var(--accent-purple); transition: width .3s; }
  .link-row a:hover::after { width: 100%; }
  .link-row a:hover { text-decoration: none; }
  .spinner { display: inline-block; width: 14px; height: 14px; border: 2px solid rgba(255,255,255,.4); border-top-color: #fff; border-radius: 50%; animation: spin .7s linear infinite; vertical-align: middle; margin-right: 6px; }
  @keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>
<div class="card">
  <div class="card-header">
    <div class="logo">COFINANCE <span>CI</span></div>
    <div class="subtitle">Créer votre compte client</div>
  </div>
  <div class="card-body">
    <h2>Inscription</h2>
    <div class="error-box"   id="error-box"></div>
    <div class="success-box" id="success-box"></div>

    <div class="grid-2">
      <div class="field">
        <label>Prénom *</label>
        <input type="text" id="first_name" placeholder="Aya" />
      </div>
      <div class="field">
        <label>Nom *</label>
        <input type="text" id="last_name" placeholder="KONÉ" />
      </div>
    </div>

    <div class="field">
      <label>Nom d'utilisateur *</label>
      <input type="text" id="username" placeholder="aya_kone" />
    </div>

    <div class="field">
      <label>Email *</label>
      <input type="email" id="email" placeholder="aya@gmail.com" />
    </div>

    <div class="grid-2">
      <div class="field">
        <label>Téléphone *</label>
        <input type="tel" id="telephone" placeholder="+225 07 00 00 00" />
      </div>
      <div class="field">
        <label>Région *</label>
        <select id="region">
          <option value="">-- Choisir --</option>
          <option>Abidjan-Plateau</option>
          <option>Yopougon</option>
          <option>Abobo</option>
          <option>Adjamé</option>
          <option>Cocody</option>
          <option>Marcory</option>
          <option>Koumassi</option>
          <option>Port-Bouët</option>
          <option>Treichville</option>
          <option>Autre</option>
        </select>
      </div>
    </div>

    <div class="field">
      <label>Numéro CNI</label>
      <input type="text" id="numero_cni" placeholder="CI-0123456789" />
    </div>

    <div class="grid-2">
      <div class="field">
        <label>Mot de passe *</label>
        <input type="password" id="password" placeholder="••••••••" />
      </div>
      <div class="field">
        <label>Confirmer *</label>
        <input type="password" id="password2" placeholder="••••••••" />
      </div>
    </div>

    <button class="btn" id="btn-register" onclick="sInscrire()">Créer mon compte</button>
    <div class="link-row">Déjà inscrit ? <a href="/login/">Se connecter</a></div>
  </div>
</div>

<script>
async function sInscrire() {
  const errBox  = document.getElementById('error-box');
  const succBox = document.getElementById('success-box');
  const btn     = document.getElementById('btn-register');
  errBox.style.display = succBox.style.display = 'none';

  const payload = {
    first_name:  document.getElementById('first_name').value.trim(),
    last_name:   document.getElementById('last_name').value.trim(),
    username:    document.getElementById('username').value.trim(),
    email:       document.getElementById('email').value.trim(),
    telephone:   document.getElementById('telephone').value.trim(),
    region:      document.getElementById('region').value,
    numero_cni:  document.getElementById('numero_cni').value.trim(),
    password:    document.getElementById('password').value,
    password2:   document.getElementById('password2').value,
  };

  if (!payload.first_name || !payload.last_name || !payload.username ||
      !payload.email || !payload.telephone || !payload.region ||
      !payload.password) {
    errBox.textContent = 'Veuillez remplir tous les champs obligatoires (*).';
    errBox.style.display = 'block'; return;
  }
  if (payload.password !== payload.password2) {
    errBox.textContent = 'Les mots de passe ne correspondent pas.';
    errBox.style.display = 'block'; return;
  }

  btn.disabled = true;
  btn.innerHTML = '<span class="spinner"></span> Création…';

  try {
    const r = await fetch('/api/auth/register/', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(payload),
    });
    const data = await r.json();
    if (!r.ok) {
      const msgs = Object.values(data).flat().join(' ');
      throw new Error(msgs);
    }
    succBox.textContent = 'Compte créé avec succès ! Redirection…';
    succBox.style.display = 'block';
    localStorage.clear();
    setTimeout(() => window.location.href = '/login/', 1800);
  } catch(e) {
    errBox.textContent = e.message;
    errBox.style.display = 'block';
    btn.disabled = false;
    btn.textContent = 'Créer mon compte';
  }
}
</script>
</body>
</html>
