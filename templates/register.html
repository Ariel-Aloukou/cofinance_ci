<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>COFINANCE CI — Inscription</title>
<style>
  :root { --bleu:#1A5276; --bleu2:#2471A3; --or:#D4AC0D; --rouge:#C0392B; --vert:#1E8449; --radius:10px; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Segoe UI', sans-serif;
    background: linear-gradient(135deg, #1A5276 0%, #2471A3 60%, #D4AC0D 100%);
    min-height: 100vh; display: flex; align-items: center;
    justify-content: center; padding: 20px;
  }
  .card { background: #fff; border-radius: 16px; box-shadow: 0 4px 24px rgba(26,82,118,0.13); width: 100%; max-width: 500px; overflow: hidden; }
  .card-header { background: var(--bleu); padding: 28px 32px 20px; text-align: center; }
  .logo { font-size: 26px; font-weight: 800; color: #fff; }
  .logo span { color: var(--or); }
  .subtitle { color: rgba(255,255,255,0.7); font-size: 12px; margin-top: 4px; }
  .card-body { padding: 28px 32px 32px; }
  .card-body h2 { font-size: 19px; color: var(--bleu); margin-bottom: 20px; font-weight: 700; }
  .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
  .field { margin-bottom: 14px; }
  .field label { display: block; font-size: 12px; font-weight: 600; color: var(--bleu); margin-bottom: 5px; }
  .field input, .field select {
    width: 100%; border: 1.5px solid #D5D8DC; border-radius: var(--radius);
    padding: 10px 13px; font-size: 13px; outline: none; transition: border-color .2s;
    background: #fff;
  }
  .field input:focus, .field select:focus { border-color: var(--bleu2); }
  .btn { width: 100%; padding: 13px; background: var(--bleu); color: #fff; border: none; border-radius: var(--radius); font-size: 15px; font-weight: 700; cursor: pointer; transition: background .2s; margin-top: 6px; }
  .btn:hover { background: var(--bleu2); }
  .btn:disabled { background: #AEB6BF; cursor: not-allowed; }
  .error-box { background: #FADBD8; color: var(--rouge); border-radius: var(--radius); padding: 10px 14px; font-size: 13px; margin-bottom: 14px; display: none; }
  .success-box { background: #D5F5E3; color: var(--vert); border-radius: var(--radius); padding: 10px 14px; font-size: 13px; margin-bottom: 14px; display: none; }
  .link-row { text-align: center; margin-top: 16px; font-size: 13px; color: #6C7A89; }
  .link-row a { color: var(--bleu2); text-decoration: none; font-weight: 600; }
  .spinner { display: inline-block; width: 14px; height: 14px; border: 2px solid rgba(255,255,255,.4); border-top-color: #fff; border-radius: 50%; animation: spin .7s linear infinite; vertical-align: middle; margin-right: 6px; }
  @keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>
<div class="card">
  <div class="card-header">
    <div class="logo">COFINANCE <span>CI</span></div>
    <div class="subtitle">Créer votre compte client</div>
  </div>
  <div class="card-body">
    <h2>Inscription</h2>
    <div class="error-box"   id="error-box"></div>
    <div class="success-box" id="success-box"></div>

    <div class="grid-2">
      <div class="field">
        <label>Prénom *</label>
        <input type="text" id="first_name" placeholder="Aya" />
      </div>
      <div class="field">
        <label>Nom *</label>
        <input type="text" id="last_name" placeholder="KONÉ" />
      </div>
    </div>

    <div class="field">
      <label>Nom d'utilisateur *</label>
      <input type="text" id="username" placeholder="aya_kone" />
    </div>

    <div class="field">
      <label>Email *</label>
      <input type="email" id="email" placeholder="aya@gmail.com" />
    </div>

    <div class="grid-2">
      <div class="field">
        <label>Téléphone *</label>
        <input type="tel" id="telephone" placeholder="+225 07 00 00 00" />
      </div>
      <div class="field">
        <label>Région *</label>
        <select id="region">
          <option value="">-- Choisir --</option>
          <option>Abidjan-Plateau</option>
          <option>Yopougon</option>
          <option>Abobo</option>
          <option>Adjamé</option>
          <option>Cocody</option>
          <option>Marcory</option>
          <option>Koumassi</option>
          <option>Port-Bouët</option>
          <option>Treichville</option>
          <option>Autre</option>
        </select>
      </div>
    </div>

    <div class="field">
      <label>Numéro CNI</label>
      <input type="text" id="numero_cni" placeholder="CI-0123456789" />
    </div>

    <div class="grid-2">
      <div class="field">
        <label>Mot de passe *</label>
        <input type="password" id="password" placeholder="••••••••" />
      </div>
      <div class="field">
        <label>Confirmer *</label>
        <input type="password" id="password2" placeholder="••••••••" />
      </div>
    </div>

    <button class="btn" id="btn-register" onclick="sInscrire()">Créer mon compte</button>
    <div class="link-row">Déjà inscrit ? <a href="/login/">Se connecter</a></div>
  </div>
</div>

<script>
async function sInscrire() {
  const errBox  = document.getElementById('error-box');
  const succBox = document.getElementById('success-box');
  const btn     = document.getElementById('btn-register');
  errBox.style.display = succBox.style.display = 'none';

  const payload = {
    first_name:  document.getElementById('first_name').value.trim(),
    last_name:   document.getElementById('last_name').value.trim(),
    username:    document.getElementById('username').value.trim(),
    email:       document.getElementById('email').value.trim(),
    telephone:   document.getElementById('telephone').value.trim(),
    region:      document.getElementById('region').value,
    numero_cni:  document.getElementById('numero_cni').value.trim(),
    password:    document.getElementById('password').value,
    password2:   document.getElementById('password2').value,
  };

  if (!payload.first_name || !payload.last_name || !payload.username ||
      !payload.email || !payload.telephone || !payload.region ||
      !payload.password) {
    errBox.textContent = 'Veuillez remplir tous les champs obligatoires (*).';
    errBox.style.display = 'block'; return;
  }
  if (payload.password !== payload.password2) {
    errBox.textContent = 'Les mots de passe ne correspondent pas.';
    errBox.style.display = 'block'; return;
  }

  btn.disabled = true;
  btn.innerHTML = '<span class="spinner"></span> Création…';

  try {
    const r = await fetch('/api/auth/register/', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(payload),
    });
    const data = await r.json();
    if (!r.ok) {
      const msgs = Object.values(data).flat().join(' ');
      throw new Error(msgs);
    }
    succBox.textContent = 'Compte créé avec succès ! Redirection…';
    succBox.style.display = 'block';
    localStorage.clear();
    setTimeout(() => window.location.href = '/login/', 1800);
  } catch(e) {
    errBox.textContent = e.message;
    errBox.style.display = 'block';
    btn.disabled = false;
    btn.textContent = 'Créer mon compte';
  }
}
</script>
</body>
</html>
